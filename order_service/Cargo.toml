[package]
name = "order_service"
version = "0.1.0"
edition = "2026"

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"

tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"

sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "migrate" , "bigdecimal"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
async-trait = "0.1"


rdkafka = { version = "0.36", features = ["cmake-build", "tokio", "zstd"] }
sqlx-cli = "0.9.0"

[build-dependencies]
tonic-prost-build = "0.14"
