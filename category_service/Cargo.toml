[package]
name = "category_service"
version = "0.1.0"
edition = "2026"

[dependencies]
# Web / GraphQL
axum = { version = "0.8", features = ["macros"] }
async-graphql = { version = "7", features = ["chrono", "uuid", "decimal"] }
async-graphql-axum = "7"
tower = "0.5"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# Async
tokio = { version = "1", features = ["full"] }

# gRPC
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"

# DB
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "migrate" , "bigdecimal" , "derive"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bigdecimal = { version = "0.4", features = ["serde"] }


# Redis
redis = { version = "0.25", features = ["tokio-comp", "connection-manager", "streams"] }

# Utils
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
async-trait = "0.1"
base64 = "0.22"
slug = "0.1"
sqlx-cli = "0.9.0"

[build-dependencies]
tonic-prost-build = "0.14"
