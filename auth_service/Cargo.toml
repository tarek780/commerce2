[package]
name = "auth_service"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde" , "v7"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
rust-argon2 = "2"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
dotenvy = "0.15"
thiserror = "1"
validator = { version = "0.18", features = ["derive"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"] }
tracing = "0.1"
tracing-subscriber = "0.3"
redis = { version = "0.27", features = ["tokio-comp", "aio", "connection-manager"] } # تم تحديثها لـ 0.27 لتتوافق مع بيئة الاختبار
tower-http = { version = "0.5", features = ["trace", "cors", "request-id", "sensitive-headers"] }
sqlx-cli = "0.9.0"
futures-util = "0.3.34"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
testcontainers = "0.20"
testcontainers-modules = { version = "0.8", features = ["postgres", "redis"] }
